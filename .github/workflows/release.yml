name: Auto Release APK

on:
  push:
    branches:
      - main
    # Notes between agents (AGENTS.md, docs) don't need a new APK.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'reviews/**'
      - 'الهوية البصرية/**'
      - '.gitignore'
      - '.github/workflows/play.yml'

permissions:
  contents: write

# Two agents push to main; queue releases instead of racing on the version bump.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto Increment Version
        id: versioning
        run: |
          props="version.properties"
          current_version=$(grep -oP '^VERSION_NAME=\K.+' $props)
          current_code=$(grep -oP '^VERSION_CODE=\K[0-9]+' $props)
          echo "Current: $current_version ($current_code)"

          # A push that edits version.properties itself sets the version on purpose
          # (e.g. a major release): publish it as written. Otherwise bump the patch.
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]              && git diff --name-only "$before" "${{ github.sha }}" | grep -qx "$props"; then
            new_version="$current_version"
            new_code="$current_code"
            echo "Version set explicitly in this push"
          else
            IFS='.' read -r major minor patch <<< "$current_version"
            new_version="$major.$minor.$((patch + 1))"
            new_code=$((current_code + 1))
          fi
          echo "New: $new_version ($new_code)"

          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$new_version/" $props
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$new_code/" $props

          echo "new_version=v$new_version" >> $GITHUB_OUTPUT
          echo "new_version_raw=$new_version" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Unit tests and lint gate the release: lint fails only on issues not in app/lint-baseline.xml.
      # Both build flavors are tested and linted; only the github flavor is published here
      # (the play flavor ships as an AAB through Google Play, see docs/play-store-plan.md).
      - name: Test, lint and build release APK
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest lintGithubDebug lintPlayDebug assembleGithubRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Every installed copy updates in place only if the signing key never changes.
      - name: Verify signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/github/release/app-github-release.apk             | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          expected="${{ vars.RELEASE_CERT_SHA256 || '4ffd408866bde43fa08bffc0ae8c63d438ba400ae539974bada48076f8e4e172' }}"
          echo "Signed with: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::app-release.apk is signed with an unexpected key ($actual). Installed apps could not update."
            exit 1
          fi

      # Installed apps download "app-release.apk"; builds up to v1.0.59 (and any debug install)
      # download "app-debug.apk". Publish the github flavor's APK under both names.
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk dist/app-release.apk
          cp app/build/outputs/apk/github/release/app-github-release.apk dist/app-debug.apk

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          if git diff --cached --quiet; then
            echo "Version was set in the pushed commit; nothing to bump"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.versioning.outputs.new_version }}"
          # main may have moved while we built; replay the bump on top of it.
          git pull --rebase origin main
          git push origin main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_version }}
          name: Release ${{ steps.versioning.outputs.new_version }}
          body: |
            Automated release for version ${{ steps.versioning.outputs.new_version }}.
            
            This release contains the latest changes pushed to the main branch. The package is signed and ready to install on Android TV.
          draft: false
          prerelease: false
          files: |
            dist/app-release.apk
            dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
